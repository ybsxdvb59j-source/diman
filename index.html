<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارگەی چەرەزاتی دیمەن</title>
<link rel="stylesheet" href="https://unpkg.com"/>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--p:#064e3b;--pl:#047857;--a:#d97706;--bg:#f3f4f6;--d:#dc2626;--s:#16a34a}
*{box-sizing:border-box;font-family:'Vazirmatn',sans-serif;margin:0;padding:0}
body{background:var(--bg);color:#1f2937;padding-bottom:40px}
header{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
.l-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:6px}
#login-screen{max-width:400px;margin:50px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center}
.container{max-width:850px;margin:15px auto;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.s-card{background:#fff;padding:10px;border-radius:10px;text-align:center;border-bottom:4px solid var(--p)}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
h3{color:var(--p);margin-bottom:10px;font-size:1rem;border-bottom:1px solid #eee;padding-bottom:6px}
.fg{margin-bottom:10px;text-align:right}
label{display:block;font-size:.85rem;margin-bottom:3px;font-weight:700}
input,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:.95rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:11px;background:var(--p);color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:5px}
#map{height:300px;width:100%;border-radius:10px;z-index:1;margin:8px 0}
.f-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.f-btn{padding:5px 12px;border-radius:15px;border:1px solid var(--p);background:#fff;color:var(--p);white-space:nowrap;font-size:.8rem}
.f-btn.active{background:var(--p);color:#fff}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:8px;background:#fafafa;border-right:5px solid var(--s)}
.item.unpaid{border-right-color:var(--d)}
.item.overdue{background:#fef2f2;border-color:#fecaca}
.badge{padding:2px 8px;border-radius:5px;font-size:.75rem;color:#fff}
.btn-sm{padding:5px 9px;font-size:.8rem;border-radius:6px;border:none;color:#fff;margin-left:5px;margin-top:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="login-screen">
<h2 style="color:var(--p);margin-bottom:8px">کارگەی چەرەزاتی دیمەن</h2>
<p style="color:#666;font-size:.85rem;margin-bottom:15px">تکایە بە ئەکاونتی تایبەتی خۆت بچۆ ژوورەوە</p>
<div class="fg"><label>ئیمەیڵ</label><input type="email" id="email" placeholder="diman@diman.com"></div>
<div class="fg"><label>وشەی نهێنی</label><input type="password" id="pass" placeholder="******"></div>
<button type="button" class="btn" id="login-btn">چوونەژوورەوە</button>
<p id="err" style="color:red;margin-top:10px;font-size:.85rem"></p>
</div>

<div id="app-screen" class="hidden">
<header>
<div><h1 style="font-size:1.1rem">کارگەی چەرەزاتی دیمەن</h1><small id="u-disp" style="font-size:.75rem"></small></div>
<button type="button" class="l-btn" id="logout-btn">چوونەدەرەوە</button>
</header>
<div class="container">
<div class="stats">
<div class="s-card"><h6>مامەڵەکان</h6><b id="st-all">0</b></div>
<div class="s-card" style="border-color:var(--s)"><h6>واسڵکراو</h6><b id="st-paid" style="color:var(--s)">0</b></div>
<div class="s-card" style="border-color:var(--d)"><h6>غەیرە واسڵ</h6><b id="st-unpaid" style="color:var(--d)">0</b></div>
</div>
<div class="card">
<h3>خەریتەی عێراق</h3>
<button type="button" class="btn" style="background:var(--a);padding:8px;font-size:.85rem" id="gps-btn">📍 شوێنی ئێستام (GPS)</button>
<div id="map"></div>
<small id="c-txt" style="color:#666">کلیک لە نەخشەکە بکە بۆ شوێنی کڕیار</small>
</div>
<div class="card">
<h3>تۆمارکردنی مامەڵە</h3>
<form id="s-form">
<div class="row">
<div class="fg"><label>ناوی کڕیار</label><input type="text" id="cname" required></div>
<div class="fg"><label>مۆبایل</label><input type="tel" id="cphone" required></div>
</div>
<div class="row">
<div class="fg"><label>پارێزگا</label>
<select id="ccity"><option>هەولێر</option><option>سلێمانی</option><option>دهۆک</option><option>کەرکوک</option><option>هەڵەبجە</option><option>بەغدا</option><option>موسڵ</option><option>بەسرە</option><option>ئەنبار</option><option>دیالە</option><option>سەڵاحەدین</option><option>نەجەف</option><option>کەربەلا</option><option>بابل</option><option>واست</option><option>میسان</option><option>زیقار</option><option>موسەننا</option><option>دیوانیە</option></select>
</div>
<div class="fg"><label>جۆر و بڕ</label><input type="text" id="idesc" required placeholder="٢٠ کیلۆ فستق"></div>
</div>
<div class="row">
<div class="fg"><label>بڕی پارە</label><input type="number" id="amt" required></div>
<div class="fg"><label>دۆخی پارەدان</label><select id="pstat"><option value="واسڵ">واسڵ</option><option value="غەیرە واسڵ">غەیرە واسڵ</option></select></div>
</div>
<div class="fg" id="dd-grp" style="display:none"><label>کاتی پارەدان</label><input type="date" id="ddate"></div>
<button type="submit" class="btn">💾 پاشەکەوتکردن</button>
</form>
</div>
<div class="card">
<h3>حسابات و کڕیاران</h3>
<div class="f-bar">
<button type="button" class="f-btn active" onclick="flt('all',this)">هەمووی</button>
<button type="button" class="f-btn" onclick="flt('غەیرە واسڵ',this)">غەیرە واسڵ</button>
<button type="button" class="f-btn" onclick="flt('واسڵ',this)">واسڵ</button>
<button type="button" class="f-btn" onclick="flt('due',this)">کاتی پارەدان</button>
</div>
<input type="text" id="srch" placeholder="گەڕان..." style="margin-bottom:10px">
<div id="list"></div>
</div>
</div>
</div>
<script src="https://unpkg.com"></script>
<script type="module">
import {initializeApp} from "https://gstatic.com";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://gstatic.com";
import {getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,query,orderBy} from "https://gstatic.com";

const app=initializeApp({apiKey:"AIzaSyDklyjBKzZvlrTD2lNWDl-zrBd3m2qSnd8",authDomain:"://firebaseapp.com",projectId:"diman-factory",storageBucket:"diman-factory.firebasestorage.app",messagingSenderId:"1027555737727",appId:"1:1027555737727:web:5637f8a9fa5aa45ae8ff4a"});
const auth=getAuth(app),db=getFirestore(app);
let map,mk,lat=33.3152,lng=44.3661,recs=[],curF='all',mLayer=L.layerGroup();

onAuthStateChanged(auth,u=>{
if(u){document.getElementById('login-screen').classList.add('hidden');document.getElementById('app-screen').classList.remove('hidden');document.getElementById('u-disp').innerText=u.email;initM();loadR();}
else{document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app-screen').classList.add('hidden');}
});

document.getElementById('login-btn').onclick=()=>{
const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;
document.getElementById('err').innerText="چاوەڕێ بکە...";
signInWithEmailAndPassword(auth,e,p).catch(er=>document.getElementById('err').innerText="هەڵە: "+er.code);
};
document.getElementById('logout-btn').onclick=()=>signOut(auth);

function initM(){if(map)return;map=L.map('map').setView([33.3152,44.3661],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);mLayer.addTo(map);map.on('click',e=>setL(e.latlng.lat,e.latlng.lng));}
function setL(la,ln){lat=la;lng=ln;if(mk)map.removeLayer(mk);mk=L.marker([la,ln]).addTo(map);document.getElementById('c-txt').innerText=`شوێن: ${la.toFixed(4)}, ${ln.toFixed(4)}`;}
document.getElementById('gps-btn').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],15);setL(p.coords.latitude,p.coords.longitude);});
document.getElementById('pstat').onchange=e=>document.getElementById('dd-grp').style.display=e.target.value==='غەیرە واسڵ'?'block':'none';

document.getElementById('s-form').onsubmit=async e=>{
e.preventDefault();const st=document.getElementById('pstat').value;
await addDoc(collection(db,"sales"),{name:document.getElementById('cname').value,phone:document.getElementById('cphone').value,city:document.getElementById('ccity').value,item:document.getElementById('idesc').value,amount:Number(document.getElementById('amt').value),status:st,dueDate:st==='غەیرە واسڵ'?document.getElementById('ddate').value:'',lat,lng,addedBy:auth.currentUser.email,createdAt:new Date().toISOString()});
document.getElementById('s-form').reset();document.getElementById('dd-grp').style.display='none';alert("تۆمارکرا!");
};

function loadR(){
onSnapshot(query(collection(db,"sales"),orderBy("createdAt","desc")),s=>{
recs=[];mLayer.clearLayers();let tp=0,tu=0;
s.forEach(d=>{const i={id:d.id,...d.data()};recs.push(i);if(i.status==='واسڵ')tp+=i.amount;else tu+=i.amount;if(i.lat)mLayer.addLayer(L.marker([i.lat,i.lng]).bindPopup(`<b>${i.name}</b><br>${i.status}: ${i.amount}`));});
document.getElementById('st-all').innerText=recs.length;document.getElementById('st-paid').innerText=tp.toLocaleString();document.getElementById('st-unpaid').innerText=tu.toLocaleString();render();
});
}

window.flt=(f,b)=>{curF=f;document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};
document.getElementById('srch').oninput=render;

function render(){
const l=document.getElementById('list'),q=document.getElementById('srch').value.toLowerCase(),td=new Date().toISOString().split('T');l.innerHTML='';
