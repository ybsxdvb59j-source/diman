<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارگەی چەرەزاتی دیمەن | Global ERP & GIS</title>
<link rel="stylesheet" href="https://unpkg.com"/>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{
  --primary:#064e3b;
  --primary-dark:#022c22;
  --gold:#d97706;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444;
  --success:#10b981;
  --shadow:0 4px 20px -2px rgba(15,23,42,0.06);
}
*{box-sizing:border-box;font-family:'Vazirmatn',sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--text);padding-bottom:80px}

#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top right,#064e3b,#022c22);padding:20px
}
.login-card{
  background:var(--surface);width:100%;max-width:400px;padding:40px 30px;
  border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.4);text-align:center
}
.brand-emblem{
  width:64px;height:64px;margin:0 auto 16px;border-radius:18px;
  background:linear-gradient(135deg,var(--gold),#f59e0b);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;
  box-shadow:0 10px 20px rgba(217,119,6,0.3)
}

header{
  background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 24px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1000
}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{
  width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem
}
.desktop-tabs{display:flex;gap:8px}
@media(max-width:768px){.desktop-tabs{display:none}}
.d-tab{
  padding:8px 16px;border-radius:10px;border:none;background:transparent;
  color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s
}
.d-tab.active{background:var(--primary);color:#fff}

.container{max-width:1200px;margin:24px auto;padding:0 16px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:850px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{
  background:var(--surface);padding:20px;border-radius:16px;border:1px solid var(--border);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between
}
.kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.kpi-val{font-size:1.5rem;font-weight:800;color:var(--text)}
.kpi-label{font-size:.82rem;color:var(--muted);font-weight:500}

.workspace-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:20px}
@media(max-width:950px){.workspace-grid{grid-template-columns:1fr}}

.card{
  background:var(--surface);padding:22px;border-radius:18px;border:1px solid var(--border);
  box-shadow:var(--shadow);margin-bottom:20px
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)
}
.card-title{font-size:1.05rem;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;gap:8px}

.map-search-bar{display:flex;gap:8px;margin-bottom:12px}
#map{height:380px;width:100%;border-radius:14px;z-index:1;border:1px solid var(--border)}
.map-footer{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  margin-top:10px;font-size:.82rem;color:var(--muted);background:#f8fafc;padding:8px 12px;border-radius:10px
}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:550px){.form-grid{grid-template-columns:1fr}}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px;color:#334155}
input,select{
  width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:10px;
  font-size:.92rem;background:#fff;transition:.2s
}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(6,78,59,0.12)}

.btn{
  padding:11px 18px;border:none;border-radius:10px;font-weight:700;font-size:.9rem;
  cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px
}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#b45309}
.btn-soft{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}
.btn-soft:hover{background:#e2e8f0}

.pills{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.pill{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;
  color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap
}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.record-card{
  border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;
  background:#fff;border-right:5px solid var(--success);transition:.2s
}
.record-card:hover{box-shadow:0 6px 15px rgba(0,0,0,0.05)}
.record-card.unpaid{border-right-color:var(--danger)}
.record-card.overdue{background:#fef2f2;border-color:#fecaca}
.badge{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.act-btn{
  padding:7px 12px;border-radius:8px;border:none;font-size:.8rem;font-weight:600;
  color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px
}

.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid var(--border);padding:8px 0;z-index:1000;justify-content:space-around
}
@media(max-width:768px){.mobile-nav{display:flex}}
.m-tab{border:none;background:none;color:var(--muted);font-size:.75rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.m-tab.active{color:var(--primary)}
.m-tab span{font-size:1.2rem}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand-emblem">د</div>
    <h2 style="color:var(--primary-dark);font-size:1.4rem;margin-bottom:6px">کارگەی چەرەزاتی دیمەن</h2>
    <p style="color:var(--muted);font-size:.88rem;margin-bottom:24px">سیستەمی نێودەوڵەتی دابەشکردن، خەریتە و حسابات</p>
    <input type="password" id="pin-code" value="1234" placeholder="کۆدی چوونەژوورەوە (1234)" style="text-align:center;font-size:1.3rem;letter-spacing:6px;margin-bottom:14px">
    <button type="button" class="btn btn-primary" onclick="unlockSystem()">چوونەژوورەوە بۆ سیستەم</button>
  </div>
</div>

<div id="app-shell" class="hidden">
  <header>
    <div class="header-brand">
      <div class="header-logo">د</div>
      <div>
        <div style="font-weight:800;font-size:1.05rem;color:var(--primary-dark)">کارگەی چەرەزاتی دیمەن</div>
        <div style="font-size:.75rem;color:var(--muted)">Enterprise Distribution & GIS</div>
      </div>
    </div>
    <div class="desktop-tabs">
      <button type="button" class="d-tab active" onclick="openTab('pos',this)">📍 نەخشە و فرۆشتن</button>
      <button type="button" class="d-tab" onclick="openTab('ledger',this)">📑 تۆماری حسابات</button>
      <button type="button" class="d-tab" onclick="openTab('stock',this)">📦 بەڕێوەبردنی کۆگا</button>
    </div>
    <button type="button" class="btn btn-soft" style="padding:7px 14px;font-size:.82rem" onclick="location.reload()">🔒 قوفڵدان</button>
  </header>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">کۆی پسوڵەکان</span><div class="kpi-icon" style="background:#e0f2fe;color:#0284c7">🧾</div></div>
        <div class="kpi-val" id="kpi-count">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">کۆی پارەی واسڵکراو</span><div class="kpi-icon" style="background:#dcfce7;color:#16a34a">💰</div></div>
        <div class="kpi-val" id="kpi-paid" style="color:var(--success)">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">کۆی قەرز (غەیرە واسڵ)</span><div class="kpi-icon" style="background:#fee2e2;color:#dc2626">⏳</div></div>
        <div class="kpi-val" id="kpi-unpaid" style="color:var(--danger)">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><span class="kpi-label">کاڵای بەردەست (کیلۆ)</span><div class="kpi-icon" style="background:#fef3c7;color:#d97706">📦</div></div>
        <div class="kpi-val" id="kpi-stock" style="color:var(--gold)">0</div>
      </div>
    </div>

    <div id="view-pos" class="view-section">
      <div class="workspace-grid">
        <div class="card">
          <div class="card-header">
            <div class="card-title">🌍 خەریتەی زیرەکی عێراق (دیاریکردنی دوکان)</div>
            <div style="display:flex;gap:6px">
              <button type="button" class="btn btn-soft" style="padding:6px 10px;font-size:.78rem" onclick="toggleMapLayer()">🛰️ سەتەلایت / شەقام</button>
              <button type="button" class="btn btn-gold" style="padding:6px 10px;font-size:.78rem" onclick="locateMe()">📍 شوێنی ئێستام</button>
            </div>
          </div>

          <div class="map-search-bar">
            <input id="map-query" placeholder="ناوی گەڕەک یان شار بنووسە (نموونە: هەڤاڵان هەولێر)..." onkeydown="if(event.key==='Enter')searchPlace()">
